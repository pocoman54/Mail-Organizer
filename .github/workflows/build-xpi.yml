name: Build Mail Organizer XPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check src/background.js
          node --check src/legacy-tools.js
          node --check src/options.js
          node --check src/popup.js

      - name: Check manifest
        run: |
          python -m json.tool src/manifest.json > /dev/null

      - name: Build XPI
        run: |
          cd src
          zip -r ../MailOrganizer-0.1.87.18.xpi . \
            -x ".gitkeep" \
            -x "*.backup"
          cd ..

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MailOrganizer-0.1.87.18
          path: MailOrganizer-0.1.87.18.xpi
